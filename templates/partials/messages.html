{% if messages %}
<div class="message-stack" aria-live="polite">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }}">
        <span class="alert-icon" aria-hidden="true">{% if 'success' in message.tags %}✓{% elif 'error' in message.tags %}!{% elif 'warning' in message.tags %}△{% else %}i{% endif %}</span>
        <span>{{ message }}</span>
    </div>
    {% endfor %}
</div>
{% endif %}
